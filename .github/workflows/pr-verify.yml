name: Pull Request Checks

on:
  pull_request:
    branches: [ main , prod]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-files:
    name: Detect Changed Files
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.compute.outputs.backend }}
      frontend: ${{ steps.compute.outputs.frontend }}
      any_changes: ${{ steps.compute.outputs.any_changes }}
    steps:
      - name: Pre-fix workspace ownership
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Fixing ownership on $GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE" ]; then
            if ! chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE" 2>/dev/null; then
              docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine sh -lc "chown -R $(id -u):$(id -g) /ws"
            fi
            if [ -d "$GITHUB_WORKSPACE/frontend/node_modules" ] || [ -d "$GITHUB_WORKSPACE/frontend/.cache" ]; then
              rm -rf "$GITHUB_WORKSPACE/frontend/node_modules" "$GITHUB_WORKSPACE/frontend/.cache" 2>/dev/null || true
              if [ -d "$GITHUB_WORKSPACE/frontend/node_modules" ] || [ -d "$GITHUB_WORKSPACE/frontend/.cache" ]; then
                docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine sh -lc 'rm -rf /ws/frontend/node_modules /ws/frontend/.cache'
              fi
            fi
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: false
          path: repo_changed_files

      - name: Fix workspace permissions (changed-files)
        shell: bash
        working-directory: repo_changed_files
        run: |
          set -euo pipefail
          if ! chown -R $(id -u):$(id -g) "$PWD" 2>/dev/null; then
            docker run --rm -v "$PWD:/ws" alpine sh -lc "chown -R $(id -u):$(id -g) /ws"
          fi
      
      - name: Compute changed files
        id: compute
        shell: bash
        working-directory: repo_changed_files
        run: |
          set -euo pipefail
          echo "Event: ${{ github.event_name }}"
          echo "Base ref: ${{ github.base_ref }}"
          echo "Base sha: ${{ github.event.pull_request.base.sha }}"
          echo "Current sha (merge or head): ${{ github.sha }}"

          # Ensure we have full history available
          if git rev-parse --is-shallow-repository >/dev/null 2>&1; then
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --prune --unshallow || true
            fi
          fi

          # Ensure base branch is fetched locally
          git fetch --no-tags origin "${{ github.base_ref }}:${{ github.base_ref }}" || git fetch --no-tags origin "${{ github.base_ref }}"

          # Diff base branch against the checked-out commit (merge commit for PRs)
          CHANGED_FILES=$(git diff --name-only "${{ github.base_ref }}...${{ github.sha }}" || true)
          printf "Changed files:\n%s\n" "$CHANGED_FILES"

          backend_changed=false
          frontend_changed=false
          if echo "$CHANGED_FILES" | grep -q '^backend/'; then backend_changed=true; fi
          if echo "$CHANGED_FILES" | grep -q '^frontend/'; then frontend_changed=true; fi

          any_changes=false
          if [ "$backend_changed" = true ] || [ "$frontend_changed" = true ]; then any_changes=true; fi

          echo "backend=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "any_changes=$any_changes" >> "$GITHUB_OUTPUT"

  check-previous-runs:
    name: Check Previous Test Runs
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
    timeout-minutes: 3
    outputs:
      backend_previously_failed: ${{ steps.check-failures.outputs.backend_failed }}
      frontend_previously_failed: ${{ steps.check-failures.outputs.frontend_failed }}
    steps:
      - name: Pre-fix workspace ownership
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Fixing ownership on $GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE" ]; then
            if ! chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE" 2>/dev/null; then
              docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine sh -lc "chown -R $(id -u):$(id -g) /ws"
            fi
            if [ -d "$GITHUB_WORKSPACE/frontend/node_modules" ] || [ -d "$GITHUB_WORKSPACE/frontend/.cache" ]; then
              rm -rf "$GITHUB_WORKSPACE/frontend/node_modules" "$GITHUB_WORKSPACE/frontend/.cache" 2>/dev/null || true
              if [ -d "$GITHUB_WORKSPACE/frontend/node_modules" ] || [ -d "$GITHUB_WORKSPACE/frontend/.cache" ]; then
                docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine sh -lc 'rm -rf /ws/frontend/node_modules /ws/frontend/.cache'
              fi
            fi
          fi

      - name: Check for previous failures
        id: check-failures
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const workflow_id = "pr-verify.yml";
            const currentRunId = context.runId;
            const prHeadSha = context.payload.pull_request?.head?.sha;

            core.info(`Checking previous runs for ${owner}/${repo}`);
            core.info(`Workflow: ${workflow_id}`);
            core.info(`Current run id: ${currentRunId}`);
            core.info(`PR head sha: ${prHeadSha || "unknown"}`);

            // Changed-file detection is authoritative for a new commit. Only a
            // previous run of this exact PR head SHA may force a retry; never
            // inherit failure state from an unrelated PR or branch.
            let backendFailed = false;
            let frontendFailed = false;

            if (!prHeadSha) {
              core.warning("PR head SHA is unavailable; changed-files alone will determine which checks run.");
            } else {
              try {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id,
                  head_sha: prHeadSha,
                  event: "pull_request",
                  per_page: 50,
                });

                const prev = runs.find(
                  (r) => r.id !== currentRunId && r.head_sha === prHeadSha
                );

                if (!prev) {
                  core.info("No previous run found for this exact PR head SHA.");
                } else {
                  const prevConclusion = prev.conclusion ?? "unknown";
                  core.info(`Previous same-head workflow status: ${prevConclusion}`);

                  const terminalNonSuccess = new Set([
                    "failure",
                    "cancelled",
                    "timed_out",
                    "action_required",
                    "stale",
                    "startup_failure",
                  ]);

                  if (terminalNonSuccess.has(prevConclusion)) {
                    backendFailed = true;
                    frontendFailed = true;
                  } else if (prevConclusion === "unknown" || prev.conclusion === null) {
                    backendFailed = true;
                    frontendFailed = true;
                    core.warning(
                      "Unable to determine same-head run conclusion; forcing checks to rerun."
                    );
                  }
                }
              } catch (err) {
                // Do not turn an Actions API lookup failure into unrelated
                // backend/frontend work. The changed-files job still ensures
                // code touched by this PR is verified.
                core.warning(
                  `Failed to query same-head workflow runs; relying on changed-files. Error: ${err?.message || err}`
                );
              }
            }

            core.setOutput("backend_failed", String(backendFailed));
            core.setOutput("frontend_failed", String(frontendFailed));

  # BACKEND PIPELINE (lint, build, unit tests)
  backend-verify:
    name: Backend Lint, Build & Unit Tests
    needs: [changed-files, check-previous-runs]
    if: ${{ needs.changed-files.outputs.backend == 'true' || needs.check-previous-runs.outputs.backend_previously_failed == 'true' }}
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Pre-fix workspace ownership
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "Fixing ownership on $GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE" ]; then
            if ! chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE" 2>/dev/null; then
              docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine sh -lc "chown -R $(id -u):$(id -g) /ws"
            fi
            if [ -d "$GITHUB_WORKSPACE/frontend/node_modules" ] || [ -d "$GITHUB_WORKSPACE/frontend/.cache" ]; then
              rm -rf "$GITHUB_WORKSPACE/frontend/node_modules" "$GITHUB_WORKSPACE/frontend/.cache" 2>/dev/null || true
              if [ -d "$GITHUB_WORKSPACE/frontend/node_modules" ] || [ -d "$GITHUB_WORKSPACE/frontend/.cache" ]; then
                docker run --rm -v "$GITHUB_WORKSPACE:/ws" alpine sh -lc 'rm -rf /ws/frontend/node_modules /ws/frontend/.cache'
              fi
            fi
          fi

      - name: Set Cargo target dir (use runner temp)
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Fix workspace permissions (backend)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! chown -R $(id -u):$(id -g) "$PWD" 2>/dev/null; then
            docker run --rm -v "$PWD:/ws" alpine sh -lc "chown -R $(id -u):$(id -g) /ws"
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Remove legacy backend/target (optional)
        run: rm -rf backend/target || true

      - name: Align dependencies with production Rust toolchain
        working-directory: ./backend
        run: cargo update -p base64ct --precise 1.6.0

      - name: Lint with clippy
        working-directory: ./backend
        run: cargo clippy -- -D warnings

      - name: Unit tests
        working-directory: ./backend
        run: cargo test --lib

  # FRONTEND PIPELINE (lint, build, unit tests)
  frontend-verify:
    name: Frontend Lint, Build & Unit Tests
    needs: [changed-files, check-previous-runs]
    if: ${{ needs.changed-files.outputs.frontend == 'true' || needs.check-previous-runs.outputs.frontend_previously_failed == 'true' }}
    runs-on: self-hosted
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: false

      - name: Fix workspace permissions and stale node_modules (frontend)
        shell: bash
        run: |
          set -euo pipefail
          if ! chown -R $(id -u):$(id -g) "$PWD" 2>/dev/null; then
            docker run --rm -v "$PWD:/ws" alpine sh -lc "chown -R $(id -u):$(id -g) /ws"
          fi
          if [ -d frontend/node_modules ]; then
            rm -rf frontend/node_modules 2>/dev/null || true
            if [ -d frontend/node_modules ]; then
              docker run --rm -v "$PWD:/ws" alpine sh -lc 'rm -rf /ws/frontend/node_modules'
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: ./frontend
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Type check with TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Unit tests (Jest + coverage; do not stop workflow)
        id: frontend-unit-tests
        working-directory: ./frontend
        run: |
          set +e
          npm run test:ci
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Coverage gate (global + per-file; fails job at end)
        id: frontend-coverage-gate
        if: always()
        working-directory: ./frontend
        env:
          COVERAGE_GATE_VERBOSE: "1"
          COVERAGE_GATE_MAX_FAILURES: "800"
          COVERAGE_GATE_TOP_LOWEST_FILES: "40"
        run: |
          set +e
          echo "::group::Coverage gate config"
          echo "cwd: $PWD"
          echo "COVERAGE_GATE_VERBOSE=${COVERAGE_GATE_VERBOSE:-unset}"
          echo "COVERAGE_GATE_MAX_FAILURES=${COVERAGE_GATE_MAX_FAILURES:-unset}"
          echo "COVERAGE_GATE_TOP_LOWEST_FILES=${COVERAGE_GATE_TOP_LOWEST_FILES:-unset}"
          echo "coverage-thresholds.json:"
          cat coverage-thresholds.json || true
          echo "::endgroup::"
          npm run check:coverage
          code=$?
          if [ "$code" != "0" ]; then
            echo "::group::Coverage artifacts (debug)"
            echo "coverage/ directory listing:"
            ls -la coverage || true
            echo ""
            echo "coverage/ contents (depth 2):"
            find coverage -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort | head -n 200 || true
            echo "::endgroup::"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-coverage
          path: frontend/coverage/
          retention-days: 30

      - name: Fail if unit tests or coverage gate failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test_code="${{ steps.frontend-unit-tests.outputs.exit_code }}"
          cov_code="${{ steps.frontend-coverage-gate.outputs.exit_code }}"
          echo "Frontend unit test exit_code: ${test_code:-unset}"
          echo "Frontend coverage gate exit_code: ${cov_code:-unset}"
          
          # If the job is going to fail due to the coverage gate, re-print a compact coverage summary
          # here so it's visible at the very end of the job logs.
          if [ "${cov_code:-1}" != "0" ]; then
            echo "::group::Coverage gate (compact summary)"
            COVERAGE_GATE_FORMAT=compact COVERAGE_GATE_VERBOSE=0 node frontend/scripts/check-coverage.js || true
            echo "::endgroup::"
          fi

          if [ "${test_code:-1}" != "0" ] || [ "${cov_code:-1}" != "0" ]; then
            echo "Failing job due to unit test or coverage gate failure."
            exit 1
          fi
      
  # DEPLOYMENT CHECK
  deploy-ready:
    name: Ready for Deployment
    needs: [backend-verify, frontend-verify]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Evaluate overall workflow result
        run: |
          echo "backend-verify: ${{ needs.backend-verify.result }}"
          echo "frontend-verify: ${{ needs.frontend-verify.result }}"
          back_ok="${{ needs.backend-verify.result }}"
          front_ok="${{ needs.frontend-verify.result }}"
          if { [ "$back_ok" != "success" ] && [ "$back_ok" != "skipped" ]; } || \
             { [ "$front_ok" != "success" ] && [ "$front_ok" != "skipped" ]; }; then
            echo "One or more jobs failed. PR is not ready for deployment."
            exit 1
          else
            echo "All checks passed or were skipped appropriately! This PR is ready to be merged to prod for deployment."
          fi
